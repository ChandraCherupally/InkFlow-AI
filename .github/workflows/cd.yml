# =============================================================
# InkFlow-AI — Continuous Deployment  (CD)
# =============================================================
# Responsibility: deploy to production after CI passes.
#
# This workflow is intentionally NOT triggered by git push.
# It is triggered by workflow_run so that deployment is
# guaranteed to happen only after the CI workflow has
# completed successfully.  If CI fails, this workflow
# never starts — Docker Hub receives no image, EC2 is
# never touched.
#
# Pipeline:
#   1.  Checkout repository          (needed to read docker/ files)
#   2.  Log in to Docker Hub
#   3.  Set up Docker Buildx
#   4.  Build & push image           (latest + SHA tags)
#   5.  Prepare deployment directory on the server
#   6.  Write production docker-compose.yml  (image-pull, no build)
#   7.  Generate runtime .env from GitHub Secrets
#   8.  Pull latest image from Docker Hub
#   9.  Restart application
#   10. Clean old Docker images
#   11. Health check
#
# Runner: self-hosted GitHub Runner on the AWS EC2 instance.
# All commands execute directly on the server — no SSH required.
# =============================================================

name: CD

on:
  # Trigger CD only after the CI workflow completes.
  # workflow_run fires when a workflow finishes, regardless of the
  # runner that executed it.  The job-level `if:` below ensures
  # we only proceed when CI concluded with 'success'.
  workflow_run:
    workflows:
      - CI # must match the `name:` field in ci.yml exactly
    types:
      - completed

  # Allow manual re-deployment from the GitHub Actions UI
  # after CI has already passed on the target commit.
  workflow_dispatch:

jobs:
  deploy:
    name: Push & Deploy
    runs-on:
      - self-hosted
      - Linux
      - X64

    # Only run when CI has completed successfully.
    # This is the enforcement point that makes the pipeline sequential.
    # Without this guard, workflow_run fires on both success AND failure.
    # workflow_dispatch runs are always allowed through (manual trigger).
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      # ---------------------------------------------------------
      # 5. Prepare deployment directory
      #    Creates ~/inkflow-ai if it does not already exist.
      #    Also ensures the outputs directory is present so the
      #    bind-mount works correctly after first deploy.
      # ---------------------------------------------------------
      - name: Prepare deployment directory
        run: |
          echo "Preparing deployment..."
          mkdir -p ~/inkflow-ai/outputs

      # ---------------------------------------------------------
      # 6. Write production docker-compose.yml
      #    This file is written fresh on every deploy so it always
      #    reflects the current repo configuration.
      #
      #    Key difference from the dev compose file:
      #      • Uses image: (pulls from Docker Hub) instead of build:
      #      • env_file and volumes are relative to ~/inkflow-ai/
      #
      #    Heredoc uses single-quoted 'COMPOSE' so that the literal
      #    ${IMAGE_NAME} is preserved in the file for Docker Compose
      #    to expand from the .env file at runtime.
      # ---------------------------------------------------------
      - name: Write production docker-compose.yml
        run: |
          echo "Writing production docker-compose.yml..."
          cat > ~/inkflow-ai/docker-compose.yml << 'COMPOSE'
          services:
            inkflow-ai:
              # Image is resolved from IMAGE_NAME in the .env file.
              # Docker Compose pulls this from Docker Hub; never rebuilds locally.
              image: ${IMAGE_NAME}:latest

              ports:
                - "8000:8000"

              # Runtime secrets and config are loaded from the .env
              # generated by the CD workflow — never from the repo.
              env_file:
                - .env

              # Persist generated outputs across container recreations.
              volumes:
                - ./outputs:/app/outputs

              restart: unless-stopped

              working_dir: /app
          COMPOSE

      # ---------------------------------------------------------
      # 7. Generate runtime .env from GitHub Secrets
      #    The file is written to ~/inkflow-ai/.env on the server.
      #    It is never committed and never echoed into logs.
      #    GitHub Actions automatically masks secret values in output.
      #
      #    Heredoc uses single-quoted 'ENV' so the shell does not
      #    re-expand values that may contain $ characters.
      # ---------------------------------------------------------
      - name: Create runtime environment file
        run: |
          echo "Creating runtime environment..."
          cat > ~/inkflow-ai/.env << 'ENV'
          # AI Provider Keys
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}

          # Google Cloud / Vertex AI
          PROJECT_ID=${{ secrets.PROJECT_ID }}
          REGION=${{ secrets.REGION }}

          # LangSmith Observability
          LANGSMITH_TRACING=${{ secrets.LANGSMITH_TRACING }}
          LANGSMITH_ENDPOINT=${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT=${{ secrets.LANGSMITH_PROJECT }}

          # Docker image reference (used by docker-compose.yml)
          IMAGE_NAME=${{ secrets.IMAGE_NAME }}
          ENV

      # ---------------------------------------------------------
      # 8. Pull latest image from Docker Hub
      #    Pulls the image declared in docker-compose.yml.
      #    No local rebuild — deployment always uses the image
      #    that was built and pushed in step 4.
      # ---------------------------------------------------------
      - name: Pull latest image
        run: |
          echo "Pulling latest image..."
          cd ~/inkflow-ai
          docker compose pull

      # ---------------------------------------------------------
      # 9. Restart application
      #    --remove-orphans cleans up containers for services
      #    that no longer exist in the compose file.
      # ---------------------------------------------------------
      - name: Restart application
        run: |
          echo "Restarting application..."
          cd ~/inkflow-ai
          docker compose up -d --remove-orphans

      # ---------------------------------------------------------
      # 10. Clean old Docker images
      #     Removes dangling images to reclaim disk space.
      #     Running containers and named volumes are not affected.
      # ---------------------------------------------------------
      - name: Clean old Docker images
        run: |
          echo "Cleaning old Docker images..."
          docker image prune -f

      # ---------------------------------------------------------
      # 11. Health check
      #     Waits 15 seconds for the application to initialise,
      #     then probes the /api/health endpoint.
      #     Fails the workflow with a clear message if unhealthy.
      # ---------------------------------------------------------
      - name: Health check
        run: |
          echo "Running health check..."
          sleep 15
          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 10 \
            http://localhost:8000/api/health \
            || { echo "❌ Health check failed — application did not start correctly."; exit 1; }
          echo "✅ Deployment completed successfully."
