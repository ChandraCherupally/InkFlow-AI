# =============================================================
# InkFlow-AI — Continuous Deployment  (CD)
# =============================================================
# Responsibility: deploy to production after CI passes.
#
# Pipeline:
#   1.  Checkout repository
#   2.  Log in to Docker Hub
#   3.  Set up Docker Buildx
#   4.  Build & push image to Docker Hub (latest + SHA tags)
#   5.  Deploy to AWS EC2 via SSH using GitHub-hosted runner (ubuntu-latest)
#   6.  Inject .env & Vertex AI credentials securely on EC2
#   7.  Pull latest image & restart docker compose on EC2
#   8.  Run health check
# =============================================================

name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    name: Push & Deploy
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Log in to Docker Hub
      # ---------------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------------------------------------------------
      # 3. Set up Docker Buildx
      # ---------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------------
      # 4. Build and push Docker image
      # ---------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.IMAGE_NAME }}:latest
            ${{ secrets.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------
      # 5. Deploy to EC2 via SSH
      # ---------------------------------------------------------
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          VERTEX_KEY_JSON: ${{ secrets.VERTEX_SERVICE_ACCOUNT_JSON }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_KEY: ${{ secrets.TAVILY_API_KEY }}
          GCP_PROJECT: ${{ secrets.PROJECT_ID }}
          GCP_REGION: ${{ secrets.REGION }}
          LS_TRACING: ${{ secrets.LANGSMITH_TRACING }}
          LS_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LS_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LS_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
          IMG_NAME: ${{ secrets.IMAGE_NAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: VERTEX_KEY_JSON,GEMINI_KEY,OPENAI_KEY,TAVILY_KEY,GCP_PROJECT,GCP_REGION,LS_TRACING,LS_ENDPOINT,LS_KEY,LS_PROJECT,IMG_NAME
          script_stop: true
          script: |
            echo "1. Preparing deployment directory..."
            mkdir -p ~/inkflow-ai/outputs

            echo "2. Writing Vertex AI credential file..."
            printf '%s\n' "$VERTEX_KEY_JSON" > ~/inkflow-ai/vertex-key.json
            chmod 600 ~/inkflow-ai/vertex-key.json

            echo "3. Writing production docker-compose.yml..."
            printf "%s\n" \
              "services:" \
              "  inkflow-ai:" \
              "    image: \${IMAGE_NAME}:latest" \
              "    ports:" \
              "      - \"8000:8000\"" \
              "    env_file:" \
              "      - .env" \
              "    volumes:" \
              "      - ./outputs:/app/outputs" \
              "      - ./vertex-key.json:/app/vertex-key.json:ro" \
              "    restart: unless-stopped" \
              "    working_dir: /app" > ~/inkflow-ai/docker-compose.yml

            echo "4. Writing runtime environment file..."
            printf "%s\n" \
              "GEMINI_API_KEY=${GEMINI_KEY}" \
              "OPENAI_API_KEY=${OPENAI_KEY}" \
              "TAVILY_API_KEY=${TAVILY_KEY}" \
              "PROJECT_ID=${GCP_PROJECT}" \
              "REGION=${GCP_REGION}" \
              "GOOGLE_APPLICATION_CREDENTIALS=/app/vertex-key.json" \
              "LANGSMITH_TRACING=${LS_TRACING}" \
              "LANGSMITH_ENDPOINT=${LS_ENDPOINT}" \
              "LANGSMITH_API_KEY=${LS_KEY}" \
              "LANGSMITH_PROJECT=${LS_PROJECT:-InkFlow-AI}" \
              "IMAGE_NAME=${IMG_NAME}" > ~/inkflow-ai/.env

            echo "5. Pulling latest image..."
            cd ~/inkflow-ai
            sudo docker compose pull

            echo "6. Restarting application container..."
            sudo docker compose up -d --remove-orphans

            echo "7. Cleaning old images..."
            sudo docker image prune -f

            echo "8. Verifying health endpoint..."
            sleep 15
            curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              http://localhost:8000/api/health \
              || { echo "❌ Health check failed"; exit 1; }

            echo "✅ Deployment completed successfully!"
