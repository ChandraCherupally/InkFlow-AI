# =============================================================
# InkFlow-AI — Continuous Integration  (CI)
# =============================================================
# Responsibility: validate every push before deployment runs.
#
# CI is the gate in the sequential CI/CD pipeline.
# CD (cd.yml) uses workflow_run to wait for this workflow
# to complete successfully before it will start.
#
# Pipeline steps:
#   1. Checkout repository
#   2. Set up Python 3.12
#   3. Install uv  (official Astral installer)
#   4. Restore uv dependency cache
#   5. Install project dependencies  (uv sync --frozen)
#   6. Run pytest — fail immediately on any test failure
#   7. Build Docker image             (build only, no push)
#
# This workflow never pushes images, deploys, or touches EC2.
# =============================================================

name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    name: Test & Docker Build
    runs-on: ubuntu-latest

    # Enable the modern Docker BuildKit engine for all steps in this job.
    # COMPOSE_DOCKER_CLI_BUILD ensures Compose also routes through BuildKit.
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Set up Python 3.12
      # ---------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------------------------
      # 3. Install uv using the official Astral installer
      # ---------------------------------------------------------
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # ---------------------------------------------------------
      # 4. Restore uv dependency cache
      #    Cache key is tied to the lockfile so the cache is
      #    invalidated automatically when dependencies change.
      # ---------------------------------------------------------
      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      # ---------------------------------------------------------
      # 5. Install project dependencies
      #    --frozen  → honour uv.lock exactly (no implicit updates)
      #    Never use pip.
      # ---------------------------------------------------------
      - name: Install dependencies
        run: uv sync --frozen

      # ---------------------------------------------------------
      # 6. Run pytest
      #    Fails the workflow immediately on any test failure.
      # ---------------------------------------------------------
      - name: Run tests
        run: uv run pytest tests/ -v

      # ---------------------------------------------------------
      # 7. Set up Docker Buildx
      #    Activates the BuildKit builder backend. Required for
      #    the cache-from / cache-to flags used in the next step.
      # ---------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------------
      # 8. Build Docker image with layer caching
      #    cache-from/cache-to use the GitHub Actions cache backend
      #    (type=gha). Unchanged layers are restored between runs,
      #    making subsequent builds significantly faster.
      #    push: false  → build only, no registry push or secrets.
      # ---------------------------------------------------------
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
